<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Master Life Maker Profit Monitor</title><style>body{margin:0;font-family:Georgia,serif;background:#07140f;color:#e8f6ee}a{color:#e3c37a}header,main{max-width:900px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.card{background:#10241c;border:1px solid #2a4b3a;border-radius:16px;padding:16px;margin:12px 0}.btn{background:#e3c37a;color:#1a1408;padding:10px 14px;border-radius:999px;border:0;font-weight:700}.kpi{color:#7dffa8;font-size:1.6rem}label{display:block;margin:10px 0 4px;color:#9ec9b3}input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #2a4b3a;background:#0b1a14;color:#e8f6ee}.row{display:flex;justify-content:space-between;flex-wrap:wrap}p{color:#9ec9b3}</style><header><p><a href='index.html'>fleet</a></p><h1>Master Life Maker profit monitor</h1><p>Feel sliders and campaign desk. Saved in this browser.</p></header><main><div class=grid><div class=card><h2>Pool this week</h2><div class=kpi id=pool>$0</div><p id=note></p></div><div class=card><h2>Giving routed</h2><div class=kpi id=give>$0</div></div><div class=card><h2>Campaign burn</h2><div class=kpi id=burn>$0</div></div></div><section class=card><h2>Human feel</h2><label>Warmth <span id=vWarm></span></label><input type=range id=warm min=0 max=100 value=72><label>Quiet hours <span id=vQuiet></span></label><input type=range id=quiet min=0 max=100 value=80><label>Urgency allowed <span id=vUrge></span></label><input type=range id=urge min=0 max=100 value=18><label>Giving % <span id=vGive></span></label><input type=range id=givePct min=5 max=30 value=11><p id=feelLine></p></section><section class=card><h2>Paid marketing desk</h2><label>Channel</label><select id=ch><option>None - organic only</option><option>Meta (local wellness)</option><option>Google Search (therapy dog / NDIS)</option><option>X boost (TherapySausages)</option></select><label>Weekly budget AUD</label><input type=number id=budget value=0 min=0><label>Campaign note</label><textarea id=cnote rows=3></textarea><p><button class=btn id=save type=button>Save campaign + recalculate</button></p><p id=campOut></p></section><section class=card><h2>Engine mix</h2><div id=mix></div></section></main><script>const engines=[['Peace Field Pack',27],['Sausage Hours',55],['Wiener Coaster',39],['Calm Audio',19],['Quiet Stay',99],['NDIS Deposit',150],['Visual License',49],['Grant Pack',79],['Giving Circle',11],['Shout a Drink',8]];function feel(){const w=+warm.value,q=+quiet.value,u=+urge.value,g=+givePct.value;vWarm.textContent=w;vQuiet.textContent=q;vUrge.textContent=u;vGive.textContent=g+'%';feelLine.textContent=q>70?'Copy stays slow and kind.':'More reach, still no cruelty.';return {w,q,u,g}}function calc(){const f=feel();const b=+budget.value||0;const boost=(0.6+f.w/200)*(f.q>85?0.92:1)*(1+f.u/400);let gross=0;mix.innerHTML='';engines.forEach((row,i)=>{const weekly=Math.round(row[1]*(1.2+i*0.08)*boost);gross+=weekly;mix.innerHTML+='<div class=row><span>'+row[0]+'</span><strong>$'+weekly+'/wk</strong></div>'});const gv=Math.round(gross*f.g/100);pool.textContent='$'+gross.toLocaleString();give.textContent='$'+gv.toLocaleString();burn.textContent='$'+b.toLocaleString();note.textContent='Projected net after ads: $'+(gross-b);campOut.textContent=ch.value+' · $'+b;localStorage.setItem('lm0609',JSON.stringify({w:f.w,q:f.q,u:f.u,g:f.g,budget:b,ch:ch.value,cnote:cnote.value}))}const s=JSON.parse(localStorage.getItem('lm0609')||'{}');if(s.w){warm.value=s.w;quiet.value=s.q;urge.value=s.u;givePct.value=s.g;budget.value=s.budget||0;ch.value=s.ch||ch.value;cnote.value=s.cnote||''}['warm','quiet','urge','givePct','budget','ch'].forEach(id=>document.getElementById(id).addEventListener('input',calc));save.onclick=calc;calc();</script>
